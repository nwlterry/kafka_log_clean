name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (e.g. v1.1.0)
        required: true
        default: v1.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Cross-compile packages
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: bash hack/package.sh "$VERSION"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: kafka_log_clean ${{ github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
          body: |
            Download the archive for your OS/arch, unpack, and run the binary.

            ```bash
            tar -xzf kafka_log_clean_*_linux_amd64.tar.gz
            chmod +x kafka_log_clean
            ./kafka_log_clean --version
            ./kafka_log_clean -i /var/log/kafka -o /tmp/kafka-logs-cleaned
            ```

            Packed with `config/kafka_default.yaml` and `config/kafka_ip_name_map.yaml`.
            Do not share a generated `report.yaml`.
